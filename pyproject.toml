[project]
name = "campus-admin"
version = "0.1.0"
description = "Application d'administration du campus (bâtiments, étages, salles)"
authors = [
    { name = "Ton Nom", email = "toi@example.com" }
]
requires-python = ">=3.11,<3.16"
dependencies = [
    "jsonschema>=4.26.0",
    "nicegui>=3.0,<4.0",
    # Dossier de données utilisateur multiplateforme (AppData / Application
    # Support / .local/share) — utilisé par get_data_path() dans campus_app.py
    # pour ne jamais écrire dans le bundle PyInstaller.
    "platformdirs>=4.3,<5.0",
]

[dependency-groups]
dev = [
    "pyinstaller>=6.10",
    "pytest>=8.0",
    "ruff>=0.16,<0.17",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = ["build", "dist", ".venv"]

[tool.ruff.lint]
# E4/E7/E9 + F : le défaut de ruff (imports et variables morts, erreurs de
# syntaxe/logique). B (flake8-bugbear) attrape en plus les pièges silencieux
# qui nous avaient déjà mordus : `assert False` supprimé par `python -O`,
# `raise` sans `from` qui masque la cause d'origine.
select = ["E4", "E7", "E9", "F", "B"]

[tool.ruff.lint.per-file-ignores]
# Les vues NiceGUI construisent l'UI par effet de bord : des widgets sont
# créés sans que la valeur retournée soit réutilisée.
"src/ui/*.py" = ["B008"]
